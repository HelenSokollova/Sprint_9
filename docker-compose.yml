services:
  selenoid:
    image: "aerokube/selenoid:1.10.7"
    container_name: selenoid
    ports:
      - "4444:4444"
    networks:
      - selenoid
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
    command: ["-browser", "chrome:128.0"]

  selenoid-ui:
    image: "aerokube/selenoid-ui:latest"
    container_name: selenoid-ui
    ports:
      - "8081:8080"
    networks:
      - selenoid
    command: ["--selenoid-uri", "http://selenoid:4444"]

  sprint_9:
    build: .
    container_name: sprint_9
    depends_on:
      - selenoid
    networks:
      - selenoid
    environment:
      - SELENOID_URL=http://selenoid:4444/wd/hub
    volumes:
      - "./allure-results:/app/allure-results"
    command: ["pytest", "tests/", "-v", "--alluredir", "/app/allure-results"]

networks:
  selenoid:
    name: selenoid
